<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #202124;
    }

    .card {
      width: min(420px, 92%);
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .notice {
      margin-top: 16px;
      padding: 10px;
      background: #eff6ff;
      color: #1e40af;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }

    .info {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
      font-size: 13px;
      color: #6b7280;
    }

    .info div {
      margin: 7px 0;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Account Demo</h1>
    <p class="subtitle">Static login interface demonstration</p>

    <form id="demoForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="off"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Demo password"
        autocomplete="off"
        required
      >

      <button type="submit">Sign In</button>
    </form>

    <div class="notice">
      Demo only — no credentials are transmitted or stored.
    </div>

    <div class="info">
      <div><strong>User Agent:</strong> <span id="userAgent"></span></div>
      <div><strong>Browser Language:</strong> <span id="language"></span></div>
      <div><strong>Timezone:</strong> <span id="timezone"></span></div>
    </div>
  </main>

  <script>
    document.getElementById("userAgent").textContent =
      navigator.userAgent;

    document.getElementById("language").textContent =
      navigator.language;

    document.getElementById("timezone").textContent =
      Intl.DateTimeFormat().resolvedOptions().timeZone;

    document.getElementById("demoForm").addEventListener("submit", function (event) {
      event.preventDefault();

      alert("Demo only: the credentials were not submitted or stored.");
      this.reset();
    });
  </script>

</body>
</html>
